<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 18px; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #5a5a5a; }
      .section-label { font-weight: 700; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; fill: #4a4a4a; }
      .node-title { font-weight: 600; font-size: 13px; fill: #1a1a1a; }
      .node-sub { font-size: 11px; fill: #5a5a5a; }
      .formula { font-family: "JetBrains Mono", "Menlo", monospace; font-size: 12px; fill: #1a1a1a; }
      .flow-label { font-size: 11px; fill: #1a1a1a; font-weight: 500; }
      .box { stroke: #1a1a1a; stroke-width: 1.4; rx: 8; ry: 8; }
      .source { fill: #f1e9ff; }
      .decision { fill: #fff6e5; }
      .zone-high { fill: #e8fce7; }
      .zone-mid { fill: #f0f4f2; }
      .zone-low { fill: #fde4e4; }
      .output { fill: #e0f2fe; }
      .layer-box { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="500" y="35" text-anchor="middle" class="title">Рисунок 3.3 — Довірочно-зважене об'єднання сигналів AI та квизу</text>
  <text x="500" y="58" text-anchor="middle" class="subtitle">Confidence-aware fusion: AI confidence визначає вагу AI-сигналів і вибір між AI та квизом для типу шкіри</text>

  <!-- INPUT SOURCES -->
  <text x="60" y="100" class="section-label">ДЖЕРЕЛА ВХІДНИХ СИГНАЛІВ</text>

  <g>
    <rect x="60" y="115" width="380" height="140" class="box source"/>
    <text x="250" y="140" text-anchor="middle" class="node-title">AI-аналіз фотографії (NormalizedSkinAnalysisResult)</text>
    <line x1="60" y1="153" x2="440" y2="153" stroke="#1a1a1a" stroke-width="1"/>
    <text x="78" y="175" class="node-sub">skin_type ∈ {dry, oily, combination, normal}</text>
    <text x="78" y="194" class="node-sub">confidence_score ∈ [0.0, 1.0]</text>
    <text x="78" y="213" class="node-sub">redness · pigmentation · hydration : Level</text>
    <text x="78" y="232" class="node-sub">pores_score ∈ [0.0, 1.0]</text>
    <text x="78" y="248" class="node-sub">oiliness · acne · fine_lines · texture : Level</text>
  </g>

  <g>
    <rect x="560" y="115" width="380" height="140" class="box source"/>
    <text x="750" y="140" text-anchor="middle" class="node-title">Відповіді користувача (QuizSubmission)</text>
    <line x1="560" y1="153" x2="940" y2="153" stroke="#1a1a1a" stroke-width="1"/>
    <text x="578" y="175" class="node-sub">self_reported_skin_type ∈ {dry, oily, combination, normal, not_sure, ∅}</text>
    <text x="578" y="194" class="node-sub">concerns : List[Concern]</text>
    <text x="578" y="213" class="node-sub">sensitivity : bool · raw_sensitivity</text>
    <text x="578" y="232" class="node-sub">routine_level · breakout_frequency</text>
    <text x="578" y="248" class="node-sub">daily_environment · sunscreen_usage</text>
  </g>

  <!-- Arrows to confidence gate -->
  <line x1="250" y1="255" x2="400" y2="320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="750" y1="255" x2="600" y2="320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CONFIDENCE GATE -->
  <text x="60" y="295" class="section-label">КРИТЕРІЙ — РІВЕНЬ ВПЕВНЕНОСТІ AI</text>

  <g>
    <rect x="320" y="320" width="360" height="60" class="box decision"/>
    <text x="500" y="343" text-anchor="middle" class="node-title">Перевірка: який зараз confidence_score AI?</text>
    <text x="500" y="365" text-anchor="middle" class="node-sub">три порогові зони: high (≥0.75), medium (0.50–0.75), low (&lt;0.50)</text>
  </g>

  <!-- Three branches -->
  <line x1="420" y1="380" x2="180" y2="450" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="380" x2="500" y2="450" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="380" x2="820" y2="450" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="265" y="420" text-anchor="middle" class="flow-label">confidence ≥ 0.75</text>
  <text x="500" y="420" text-anchor="middle" class="flow-label">0.50 ≤ confidence &lt; 0.75</text>
  <text x="730" y="420" text-anchor="middle" class="flow-label">confidence &lt; 0.50</text>

  <!-- Three branches -->
  <!-- HIGH zone -->
  <g>
    <rect x="40" y="450" width="290" height="200" class="box zone-high"/>
    <text x="185" y="475" text-anchor="middle" class="node-title">High confidence</text>
    <text x="185" y="494" text-anchor="middle" class="node-sub">"ai_high_confidence"</text>
    <line x1="60" y1="508" x2="310" y2="508" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="55" y="530" class="node-sub">• skin_type = AI</text>
    <text x="55" y="552" class="node-sub">• ai_weight = 1.0</text>
    <text x="55" y="574" class="node-sub">• AI-концерни беруть свою</text>
    <text x="55" y="589" class="node-sub">  повну вагу (до 1.0)</text>
    <text x="55" y="615" class="node-sub">• квиз концерни: фіксована</text>
    <text x="55" y="630" class="node-sub">  вага 0.7; merge через max</text>
  </g>

  <!-- MEDIUM zone -->
  <g>
    <rect x="355" y="450" width="290" height="200" class="box zone-mid"/>
    <text x="500" y="475" text-anchor="middle" class="node-title">Medium confidence</text>
    <text x="500" y="494" text-anchor="middle" class="node-sub">"ai_medium_confidence"</text>
    <line x1="375" y1="508" x2="625" y2="508" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="370" y="530" class="node-sub">• skin_type = AI (помітка)</text>
    <text x="370" y="552" class="node-sub">• ai_weight = лінійна</text>
    <text x="370" y="568" class="node-sub">  інтерполяція [0.3 … 1.0]</text>
    <text x="370" y="590" class="node-sub">• AI-сигнали злегка</text>
    <text x="370" y="606" class="node-sub">  ослаблені пропорційно</text>
    <text x="370" y="630" class="node-sub">• квиз = 0.7; merge через max</text>
  </g>

  <!-- LOW zone -->
  <g>
    <rect x="670" y="450" width="290" height="200" class="box zone-low"/>
    <text x="815" y="475" text-anchor="middle" class="node-title">Low confidence</text>
    <text x="815" y="494" text-anchor="middle" class="node-sub">"low_confidence_quiz_override" /</text>
    <text x="815" y="509" text-anchor="middle" class="node-sub">"low_confidence_default"</text>
    <line x1="690" y1="520" x2="940" y2="520" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="685" y="540" class="node-sub">• якщо є квиз → skin_type = квиз</text>
    <text x="685" y="558" class="node-sub">• якщо not_sure / ∅ → NORMAL</text>
    <text x="685" y="580" class="node-sub">• ai_weight = 0.3 (мінімум)</text>
    <text x="685" y="602" class="node-sub">• AI-концерни сильно ослаблені</text>
    <text x="685" y="624" class="node-sub">• UI показує банер прозорості</text>
  </g>

  <!-- FUSION FORMULAS -->
  <text x="60" y="700" class="section-label">МАТЕМАТИЧНА МОДЕЛЬ ОБ'ЄДНАННЯ</text>

  <g>
    <rect x="40" y="715" width="920" height="120" class="box layer-box"/>
    <text x="500" y="740" text-anchor="middle" class="node-title">Підсумкова вага концерну c:</text>
    <text x="500" y="770" text-anchor="middle" class="formula">w(c) = max(  w_quiz(c)  ,  ai_weight(confidence) × w_AI(c)  )</text>
    <text x="500" y="800" text-anchor="middle" class="node-sub">де: w_quiz(c) = 0.7, якщо концерн вибраний у квизі; інакше 0</text>
    <text x="500" y="817" text-anchor="middle" class="node-sub">w_AI(c) ∈ [0, 1.0] — інтенсивність концерну за AI; ai_weight ∈ [0.3, 1.0] лінійно по confidence</text>
  </g>

  <!-- Outputs -->
  <text x="60" y="880" class="section-label">ВИХІДНІ ДАНІ ДЛЯ СКОРИНГУ</text>

  <line x1="185" y1="650" x2="280" y2="900" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)" stroke-opacity="0.5"/>
  <line x1="500" y1="650" x2="500" y2="900" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)" stroke-opacity="0.5"/>
  <line x1="815" y1="650" x2="720" y2="900" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)" stroke-opacity="0.5"/>

  <g>
    <rect x="60" y="900" width="880" height="135" class="box output"/>
    <text x="500" y="925" text-anchor="middle" class="node-title">FusionDecision → RecommendationEngine.score()</text>
    <line x1="80" y1="938" x2="920" y2="938" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="80" y="960" class="formula">effective_skin_type : str  →  жорсткий фільтр продуктів (allowed_skin_types)</text>
    <text x="80" y="980" class="formula">resolution : str  →  метадані для UI (банер прозорості)</text>
    <text x="80" y="1000" class="formula">w(c) для кожного c  →  скорінг продуктів: score += w(c), якщо c ∈ product.concerns</text>
    <text x="80" y="1020" class="formula">+ квиз-бонуси (BREAKOUT, SUNSCREEN, POLLUTION) — додаються до фінального score</text>
  </g>

  <!-- Footer -->
  <text x="500" y="1075" text-anchor="middle" font-size="11" fill="#5a5a5a">Принцип: при високій впевненості AI домінує; при низькій — пріоритет переходить до самооцінки користувача; сенситивність та поведінкові бонуси завжди беруться лише з квизу</text>
</svg>

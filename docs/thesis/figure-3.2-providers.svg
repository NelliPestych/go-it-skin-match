<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L13,7 L0,14 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font-weight: 700; font-size: 18px; fill: #1a1a1a; }
      .interface-stereotype { font-style: italic; font-size: 12px; fill: #5a5a5a; }
      .class-name { font-weight: 700; font-size: 14px; fill: #1a1a1a; }
      .member { font-size: 12px; fill: #1a1a1a; font-family: "JetBrains Mono", "Menlo", monospace; }
      .note { font-size: 11px; fill: #5a5a5a; }
      .box { stroke: #1a1a1a; stroke-width: 1.5; fill: #ffffff; }
      .interface { fill: #f1e9ff; }
      .impl { fill: #e8fce7; }
      .header-line { stroke: #1a1a1a; stroke-width: 1; }
    </style>
  </defs>

  <text x="450" y="35" text-anchor="middle" class="title">Рисунок 3.2 — Provider-based архітектура AI-аналізу</text>
  <text x="450" y="58" text-anchor="middle" class="note">UML-діаграма успадкування: єдиний інтерфейс SkinAnalysisProvider та його три реалізації</text>

  <!-- Interface SkinAnalysisProvider -->
  <g>
    <rect x="290" y="100" width="320" height="135" class="box interface"/>
    <text x="450" y="125" text-anchor="middle" class="interface-stereotype">«interface»</text>
    <text x="450" y="146" text-anchor="middle" class="class-name">SkinAnalysisProvider</text>
    <line x1="290" y1="158" x2="610" y2="158" class="header-line"/>
    <text x="305" y="180" class="member">+ name : str</text>
    <line x1="290" y1="192" x2="610" y2="192" class="header-line"/>
    <text x="305" y="213" class="member">+ analyze(front, left?, right?)</text>
    <text x="320" y="229" class="member">  → NormalizedSkinAnalysisResult</text>
  </g>

  <!-- Diagonal/cross lines from interface to three implementations -->
  <line x1="450" y1="235" x2="450" y2="295" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#inherit)"/>
  <line x1="450" y1="295" x2="155" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="295" x2="745" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="155" y1="295" x2="155" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="295" x2="450" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="745" y1="295" x2="745" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- LocalHeuristicProvider -->
  <g>
    <rect x="40" y="335" width="230" height="245" class="box impl"/>
    <text x="155" y="362" text-anchor="middle" class="class-name">LocalHeuristicProvider</text>
    <line x1="40" y1="376" x2="270" y2="376" class="header-line"/>
    <text x="55" y="398" class="member">+ name = "local"</text>
    <line x1="40" y1="410" x2="270" y2="410" class="header-line"/>
    <text x="55" y="432" class="member">+ analyze(...)</text>
    <line x1="40" y1="446" x2="270" y2="446" class="header-line"/>
    <text x="155" y="468" text-anchor="middle" class="note">OpenCV / NumPy</text>
    <text x="155" y="486" text-anchor="middle" class="note">Haar cascade + HSV</text>
    <text x="155" y="504" text-anchor="middle" class="note">heuristic skin signals</text>
    <text x="155" y="528" text-anchor="middle" class="note">не вимагає API-ключа</text>
    <text x="155" y="546" text-anchor="middle" class="note">завжди доступний</text>
    <text x="155" y="568" text-anchor="middle" class="note">за замовчуванням / fallback</text>
  </g>

  <!-- MockHautProvider -->
  <g>
    <rect x="335" y="335" width="230" height="245" class="box impl"/>
    <text x="450" y="362" text-anchor="middle" class="class-name">MockHautProvider</text>
    <line x1="335" y1="376" x2="565" y2="376" class="header-line"/>
    <text x="350" y="398" class="member">+ name = "mock_haut"</text>
    <line x1="335" y1="410" x2="565" y2="410" class="header-line"/>
    <text x="350" y="432" class="member">+ analyze(...)</text>
    <line x1="335" y1="446" x2="565" y2="446" class="header-line"/>
    <text x="450" y="468" text-anchor="middle" class="note">детермінований мок</text>
    <text x="450" y="486" text-anchor="middle" class="note">seed = sha256(front_bytes)</text>
    <text x="450" y="504" text-anchor="middle" class="note">реалістичні розподіли</text>
    <text x="450" y="528" text-anchor="middle" class="note">для демо й E2E тестів</text>
    <text x="450" y="546" text-anchor="middle" class="note">без зовнішніх викликів</text>
    <text x="450" y="568" text-anchor="middle" class="note">альтернатива у fallback</text>
  </g>

  <!-- OpenAIVisionProvider -->
  <g>
    <rect x="630" y="335" width="230" height="245" class="box impl"/>
    <text x="745" y="362" text-anchor="middle" class="class-name">OpenAIVisionProvider</text>
    <line x1="630" y1="376" x2="860" y2="376" class="header-line"/>
    <text x="645" y="398" class="member">+ name = "openai_vision"</text>
    <line x1="630" y1="410" x2="860" y2="410" class="header-line"/>
    <text x="645" y="432" class="member">+ analyze(...)</text>
    <line x1="630" y1="446" x2="860" y2="446" class="header-line"/>
    <text x="745" y="468" text-anchor="middle" class="note">модель gpt-4o-mini</text>
    <text x="745" y="486" text-anchor="middle" class="note">response_format = json_object</text>
    <text x="745" y="504" text-anchor="middle" class="note">image detail = low (cost)</text>
    <text x="745" y="528" text-anchor="middle" class="note">system prompt: без медичних</text>
    <text x="745" y="546" text-anchor="middle" class="note">діагнозів, лише косметичні</text>
    <text x="745" y="568" text-anchor="middle" class="note">сигнали; ключ через ENV</text>
  </g>

  <!-- Footer note about fallback -->
  <g>
    <rect x="40" y="610" width="820" height="78" rx="8" ry="8" stroke="#1a1a1a" stroke-width="1.2" fill="#fff6e5"/>
    <text x="450" y="635" text-anchor="middle" font-weight="700" font-size="13" fill="#1a1a1a">Fallback-механізм</text>
    <text x="450" y="657" text-anchor="middle" class="note">Якщо основний провайдер недоступний (помилка SDK, 5xx, timeout або перевищено ліміт запитів),</text>
    <text x="450" y="675" text-anchor="middle" class="note">фабрика автоматично перемикає виклик на резервний (Local або MockHaut). Цикл fallback-у заборонений.</text>
  </g>
</svg>

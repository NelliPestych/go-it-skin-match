<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .layer-title { font-weight: 700; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; fill: #4a4a4a; }
      .module-title { font-weight: 600; font-size: 13px; fill: #1a1a1a; }
      .module-sub { font-size: 11px; fill: #5a5a5a; }
      .flow { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .layer-box { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.5; }
      .module-box { stroke: #1a1a1a; stroke-width: 1.2; rx: 8; ry: 8; }
      .frontend { fill: #f1e9ff; }
      .backend { fill: #fde4e4; }
      .ai { fill: #e8fce7; }
      .storage { fill: #fff6e5; }
      .title { font-weight: 700; font-size: 18px; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">Рисунок 3.1 — Архітектура системи SkinMatch</text>

  <!-- Frontend layer -->
  <rect x="40" y="65" width="820" height="160" rx="12" ry="12" class="layer-box frontend"/>
  <text x="60" y="92" class="layer-title">КЛІЄНТСЬКА ЧАСТИНА — Frontend (React + TypeScript)</text>

  <g>
    <rect x="60" y="110" width="148" height="98" class="module-box" fill="#ffffff"/>
    <text x="134" y="140" text-anchor="middle" class="module-title">Landing Page</text>
    <text x="134" y="160" text-anchor="middle" class="module-sub">Вхідна сторінка</text>
    <text x="134" y="178" text-anchor="middle" class="module-sub">застосунку</text>
  </g>
  <g>
    <rect x="220" y="110" width="148" height="98" class="module-box" fill="#ffffff"/>
    <text x="294" y="135" text-anchor="middle" class="module-title">Smart Camera</text>
    <text x="294" y="155" text-anchor="middle" class="module-sub">MediaPipe Face</text>
    <text x="294" y="171" text-anchor="middle" class="module-sub">Landmarker — gating</text>
    <text x="294" y="187" text-anchor="middle" class="module-sub">+ 3-shot capture</text>
  </g>
  <g>
    <rect x="380" y="110" width="148" height="98" class="module-box" fill="#ffffff"/>
    <text x="454" y="135" text-anchor="middle" class="module-title">Quiz Module</text>
    <text x="454" y="155" text-anchor="middle" class="module-sub">7 конфігуративних</text>
    <text x="454" y="171" text-anchor="middle" class="module-sub">питань про шкіру</text>
    <text x="454" y="187" text-anchor="middle" class="module-sub">та звички</text>
  </g>
  <g>
    <rect x="540" y="110" width="148" height="98" class="module-box" fill="#ffffff"/>
    <text x="614" y="135" text-anchor="middle" class="module-title">Results Page</text>
    <text x="614" y="155" text-anchor="middle" class="module-sub">AI Skin Report</text>
    <text x="614" y="171" text-anchor="middle" class="module-sub">+ персональні</text>
    <text x="614" y="187" text-anchor="middle" class="module-sub">рекомендації</text>
  </g>
  <g>
    <rect x="700" y="110" width="148" height="98" class="module-box" fill="#ffffff"/>
    <text x="774" y="135" text-anchor="middle" class="module-title">History Module</text>
    <text x="774" y="155" text-anchor="middle" class="module-sub">Перегляд попередніх</text>
    <text x="774" y="171" text-anchor="middle" class="module-sub">сканувань</text>
    <text x="774" y="187" text-anchor="middle" class="module-sub">користувача</text>
  </g>

  <!-- Arrow Frontend → Backend -->
  <line x1="450" y1="225" x2="450" y2="270" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="465" y="252" class="flow">REST API · HTTPS · JWT (Bearer)</text>

  <!-- Backend layer -->
  <rect x="40" y="280" width="820" height="195" rx="12" ry="12" class="layer-box backend"/>
  <text x="60" y="307" class="layer-title">СЕРВЕРНА ЧАСТИНА — Backend (FastAPI)</text>

  <g>
    <rect x="60" y="325" width="180" height="135" class="module-box" fill="#ffffff"/>
    <text x="150" y="350" text-anchor="middle" class="module-title">Автентифікація</text>
    <text x="150" y="372" text-anchor="middle" class="module-sub">/auth/register</text>
    <text x="150" y="390" text-anchor="middle" class="module-sub">/auth/login</text>
    <text x="150" y="408" text-anchor="middle" class="module-sub">scrypt + PyJWT (HS256)</text>
    <text x="150" y="426" text-anchor="middle" class="module-sub">get_current_user →</text>
    <text x="150" y="444" text-anchor="middle" class="module-sub">прив'язка user_id</text>
  </g>
  <g>
    <rect x="255" y="325" width="180" height="135" class="module-box" fill="#ffffff"/>
    <text x="345" y="350" text-anchor="middle" class="module-title">REST API</text>
    <text x="345" y="372" text-anchor="middle" class="module-sub">/analysis/upload</text>
    <text x="345" y="390" text-anchor="middle" class="module-sub">/quiz/submit</text>
    <text x="345" y="408" text-anchor="middle" class="module-sub">/analysis/history</text>
    <text x="345" y="426" text-anchor="middle" class="module-sub">/recommendations/{id}</text>
    <text x="345" y="444" text-anchor="middle" class="module-sub">/plan/{id}</text>
  </g>
  <g>
    <rect x="450" y="325" width="180" height="135" class="module-box" fill="#ffffff"/>
    <text x="540" y="350" text-anchor="middle" class="module-title">Analysis Service</text>
    <text x="540" y="372" text-anchor="middle" class="module-sub">валідація завантажень,</text>
    <text x="540" y="390" text-anchor="middle" class="module-sub">персистенція зображень,</text>
    <text x="540" y="408" text-anchor="middle" class="module-sub">виклик AI-провайдера,</text>
    <text x="540" y="426" text-anchor="middle" class="module-sub">збереження результатів</text>
    <text x="540" y="444" text-anchor="middle" class="module-sub">у features_json</text>
  </g>
  <g>
    <rect x="645" y="325" width="180" height="135" class="module-box" fill="#ffffff"/>
    <text x="735" y="350" text-anchor="middle" class="module-title">Recommendation +</text>
    <text x="735" y="368" text-anchor="middle" class="module-title">Plan Services</text>
    <text x="735" y="390" text-anchor="middle" class="module-sub">скорінг продуктів</text>
    <text x="735" y="408" text-anchor="middle" class="module-sub">за концернами,</text>
    <text x="735" y="426" text-anchor="middle" class="module-sub">формування ранкової</text>
    <text x="735" y="444" text-anchor="middle" class="module-sub">і вечірньої рутини</text>
  </g>

  <!-- Arrows Backend → AI + Storage -->
  <line x1="260" y1="475" x2="260" y2="540" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="275" y="510" class="flow">SkinAnalysisProvider · виклик analyze()</text>

  <line x1="660" y1="475" x2="660" y2="775" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="675" y="495" class="flow">SQL (SQLAlchemy ORM)</text>
  <text x="675" y="511" class="flow">CRUD over PostgreSQL</text>

  <!-- AI layer -->
  <rect x="40" y="550" width="475" height="370" rx="12" ry="12" class="layer-box ai"/>
  <text x="60" y="577" class="layer-title">AI-РІВЕНЬ — Provider-based аналіз шкіри</text>

  <g>
    <rect x="60" y="595" width="435" height="50" class="module-box" fill="#ffffff"/>
    <text x="277" y="617" text-anchor="middle" class="module-title">«interface»  SkinAnalysisProvider</text>
    <text x="277" y="634" text-anchor="middle" class="module-sub">analyze(front, left?, right?) → NormalizedSkinAnalysisResult</text>
  </g>

  <g>
    <rect x="60" y="660" width="138" height="80" class="module-box" fill="#ffffff"/>
    <text x="129" y="685" text-anchor="middle" class="module-title">Local</text>
    <text x="129" y="701" text-anchor="middle" class="module-title">Heuristic</text>
    <text x="129" y="720" text-anchor="middle" class="module-sub">OpenCV +</text>
    <text x="129" y="735" text-anchor="middle" class="module-sub">евристика</text>
  </g>
  <g>
    <rect x="208" y="660" width="138" height="80" class="module-box" fill="#ffffff"/>
    <text x="277" y="685" text-anchor="middle" class="module-title">Mock Haut</text>
    <text x="277" y="704" text-anchor="middle" class="module-sub">детермінований</text>
    <text x="277" y="720" text-anchor="middle" class="module-sub">мок для демо</text>
    <text x="277" y="735" text-anchor="middle" class="module-sub">й тестів</text>
  </g>
  <g>
    <rect x="356" y="660" width="138" height="80" class="module-box" fill="#ffffff"/>
    <text x="425" y="685" text-anchor="middle" class="module-title">OpenAI</text>
    <text x="425" y="701" text-anchor="middle" class="module-title">Vision</text>
    <text x="425" y="720" text-anchor="middle" class="module-sub">gpt-4o-mini</text>
    <text x="425" y="735" text-anchor="middle" class="module-sub">JSON output</text>
  </g>

  <!-- arrows from interface to implementations -->
  <line x1="129" y1="660" x2="129" y2="645" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="277" y1="660" x2="277" y2="645" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="425" y1="660" x2="425" y2="645" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="129" y1="645" x2="425" y2="645" stroke="#1a1a1a" stroke-width="1.2"/>

  <line x1="277" y1="740" x2="277" y2="785" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="790" width="435" height="115" class="module-box" fill="#ffffff"/>
    <text x="277" y="816" text-anchor="middle" class="module-title">Шар нормалізації</text>
    <text x="277" y="834" text-anchor="middle" class="module-sub">NormalizedSkinAnalysisResult</text>
    <text x="277" y="858" text-anchor="middle" class="module-sub">skin_type · hydration · oiliness · redness · pores</text>
    <text x="277" y="876" text-anchor="middle" class="module-sub">texture · acne · fine_lines · confidence_score</text>
    <text x="277" y="894" text-anchor="middle" class="module-sub">recommendation_signals</text>
  </g>

  <!-- Storage layer -->
  <rect x="540" y="550" width="320" height="370" rx="12" ry="12" class="layer-box storage"/>
  <text x="560" y="577" class="layer-title">РІВЕНЬ ЗБЕРЕЖЕННЯ</text>

  <g>
    <rect x="560" y="595" width="280" height="48" class="module-box" fill="#ffffff"/>
    <text x="700" y="623" text-anchor="middle" class="module-title">PostgreSQL · SQLAlchemy ORM</text>
  </g>

  <g>
    <rect x="560" y="658" width="280" height="42" class="module-box" fill="#ffffff"/>
    <text x="700" y="685" text-anchor="middle" class="module-sub">users (email, password_hash, created_at)</text>
  </g>
  <g>
    <rect x="560" y="710" width="280" height="42" class="module-box" fill="#ffffff"/>
    <text x="700" y="737" text-anchor="middle" class="module-sub">skin_scans (image_paths, features_json)</text>
  </g>
  <g>
    <rect x="560" y="762" width="280" height="42" class="module-box" fill="#ffffff"/>
    <text x="700" y="789" text-anchor="middle" class="module-sub">quiz_answers (answers_json)</text>
  </g>
  <g>
    <rect x="560" y="814" width="280" height="42" class="module-box" fill="#ffffff"/>
    <text x="700" y="841" text-anchor="middle" class="module-sub">recommendations (product_id, score, reasons)</text>
  </g>
  <g>
    <rect x="560" y="866" width="280" height="42" class="module-box" fill="#ffffff"/>
    <text x="700" y="893" text-anchor="middle" class="module-sub">routine_plans (plan_json) · products</text>
  </g>

  <!-- Footer -->
  <text x="450" y="970" text-anchor="middle" font-size="11" fill="#5a5a5a">Усі персональні дані ізольовані за user_id; fallback-провайдер активується автоматично при недоступності основного</text>
  <text x="450" y="990" text-anchor="middle" font-size="11" fill="#5a5a5a">Сценарій запиту: Frontend → Backend → AI-провайдер → Нормалізація → Recommendation/Plan → PostgreSQL → Frontend</text>
</svg>
